id: node-npm-exora-monorepo-v1
version: 1
runtime: node
lockfileRequired: true
monorepo: true
artifactPath: .central-cicd/release
packages:
  - name: marketing-client
    workingDir: exora-mern/client
    lockfile: package-lock.json
    install: npm ci
    build: npm run build
    artifactPath: dist
    artifactTarget: marketing-client
  - name: main-server
    workingDir: exora-mern/server
    lockfile: package-lock.json
    install: npm ci
    test: npm test
    artifactTarget: main-server
    artifactIncludes:
      - package.json
      - package-lock.json
      - server.js
      - config
      - controllers
      - data
      - middleware
      - migrations
      - models
      - public
      - registry
      - routes
      - scripts
      - services
  - name: crm-backend
    workingDir: exora-mern/exora-crm/backend
    lockfile: package-lock.json
    install: npm ci
    artifactTarget: crm-backend
    artifactIncludes:
      - package.json
      - package-lock.json
      - server.js
      - crm.json
      - config
      - jobs
      - middleware
      - routes
      - services
  - name: crm-frontend
    workingDir: exora-mern/exora-crm/frontend
    lockfile: package-lock.json
    install: npm ci
    build: npm run build
    artifactPath: dist
    artifactTarget: crm-frontend
