id: node-npm-nomi-source-v1
version: 1
runtime: node
lockfileRequired: true
monorepo: true
artifactPath: .central-cicd/release
packages:
  - name: nomi-app
    workingDir: .
    lockfile: package-lock.json
    install: npm ci
    build: npm run build
    artifactTarget: nomi-source
    artifactIncludes:
      - app
      - components
      - lib
      - prisma
      - middleware.ts
      - package.json
      - package-lock.json
      - next.config.ts
      - postcss.config.mjs
      - tsconfig.json
