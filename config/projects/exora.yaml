schemaVersion: 1
project:
  id: exora
  jenkinsJob: exora-static
  enabled: true
  github:
    owner: yeshwanth1127
    repo: exora
    branch: master
  build:
    profile: node-npm-static-site-v1
    agentLabel: linux-build
    testsRequired: true
    timeoutMinutes: 60
  deployment:
    mode: manual
    adapter: exora-static
    targetId: exora-static
    environment: production
  healthCheck:
    type: http
    url: http://127.0.0.1:8110/
