id: exora-static
projectId: exora
environment: production
adapter: exora-static
rootPath: /srv/apps/exora-website
releaseRoot: /srv/apps/exora-website/releases
currentPath: /srv/apps/exora-website/current
health:
  type: http
  url: http://127.0.0.1:8110/
  expectedStatus: 200
  timeoutMs: 10000
runtime:
  containerName: exora-web
  imageRepository: exora-web
  hostBinding: "127.0.0.1:8110:80"
  artifactPath: .central-cicd/release/static-site/dist
enabled: false
