id: nomi-production
projectId: nomi
environment: production
adapter: compose
rootPath: /srv/apps/nomi
releaseRoot: /srv/apps/nomi/.central-cicd/releases
currentPath: /srv/apps/nomi
health:
  type: none
  timeoutMs: 10000
runtime:
  composeProject: nomi
  composeWorkingDir: /srv/apps/nomi
  composeFiles: /srv/apps/nomi/compose.yaml
  composeServices: nomi
  builtServices: nomi
  healthServices: nomi
  containers: nomi
  publicBindings: 127.0.0.1:3002->3000
  persistentMounts: /srv/apps/nomi/data/uploads:/app/data/uploads
  preservePolicy: preserve-nomi-uploads-external-postgres
  candidateContextPolicy: nomi-next-source-v1
  healthContract: nomi-node-root-http-v1
  deploymentStatus: compose-helper-installed-and-staging-validated
  composeHealthPolicy: docker-healthcheck-required
enabled: true
